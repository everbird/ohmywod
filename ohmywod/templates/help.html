{% block additional_help_sections %}
  <section class="content-section info-section" id="add_to_home_screen">
    <div class="section-header">
      <h2 class="section-title">添加到手机桌面</h2>
    </div>
    <p class="mb-0">用手机打开本站：Android 的 Chrome 或 Firefox 在浏览器菜单中选择“安装应用”或“添加到主屏幕”；iPhone 在分享菜单中选择“添加到主屏幕”（如有“作为 Web App 打开”，请保持开启）。之后从桌面图标打开，就能像 App 一样浏览；战报仍需联网查看。</p>
  </section>
{% endblock %}
